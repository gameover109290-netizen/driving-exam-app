<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background Road -->
  <rect width="200" height="200" fill="#9e9e9e"/>
  
  <defs>
    <!-- Diagonal Stripes Pattern -->
    <pattern id="zebra" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="white" stroke-width="8"/>
    </pattern>
  </defs>
  
  <!-- Zebra Zone -->
  <polygon points="40,20 160,20 130,180 70,180" fill="url(#zebra)" stroke="white" stroke-width="4"/>
</svg>
