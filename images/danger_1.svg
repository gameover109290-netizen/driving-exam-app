<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background -->
  <rect width="400" height="400" fill="#8bc34a"/>
  <!-- Roads -->
  <rect x="120" y="0" width="160" height="400" fill="#9e9e9e"/>
  <rect x="0" y="120" width="400" height="160" fill="#9e9e9e"/>
  <rect x="120" y="120" width="160" height="160" fill="#757575"/> <!-- Intersection center -->
  
  <!-- Center Lines -->
  <line x1="200" y1="0" x2="200" y2="120" stroke="white" stroke-width="4" stroke-dasharray="10,10"/>
  <line x1="200" y1="280" x2="200" y2="400" stroke="white" stroke-width="4" stroke-dasharray="10,10"/>
  <line x1="0" y1="200" x2="120" y2="200" stroke="white" stroke-width="4" stroke-dasharray="10,10"/>
  <line x1="280" y1="200" x2="400" y2="200" stroke="white" stroke-width="4" stroke-dasharray="10,10"/>
  
  <!-- Crosswalks -->
  <g stroke="white" stroke-width="6" stroke-dasharray="10,10">
    <line x1="290" y1="130" x2="290" y2="270"/>
    <line x1="110" y1="130" x2="110" y2="270"/>
  </g>

  <!-- Ego Car (Blue) -->
  <g transform="translate(140, 240) rotate(15)">
    <rect width="40" height="70" rx="5" fill="#1976d2"/>
    <polygon points="40,10 60,10 50,-5" fill="yellow"/> <!-- Right blinker/direction -->
  </g>

  <!-- Oncoming Car (Red) -->
  <rect x="220" y="60" width="40" height="70" rx="5" fill="#d32f2f"/>

  <!-- Pedestrian (Orange) -->
  <circle cx="300" cy="180" r="10" fill="#ff9800"/>
  <line x1="300" y1="180" x2="280" y2="180" stroke="#ff9800" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
