<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#9e9e9e"/>
  
  <defs>
    <pattern id="keepout" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#fbc02d" stroke-width="8"/>
    </pattern>
  </defs>
  
  <!-- 立ち入り禁止部分 (黄色の実線と黄色の斜線) -->
  <polygon points="40,20 160,20 130,180 70,180" fill="url(#keepout)" stroke="#fbc02d" stroke-width="6"/>
</svg>
