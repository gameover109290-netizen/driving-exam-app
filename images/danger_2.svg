<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#8bc34a"/>
  <!-- Road -->
  <rect x="0" y="100" width="400" height="200" fill="#9e9e9e"/>
  <!-- Center Line -->
  <line x1="0" y1="200" x2="400" y2="200" stroke="white" stroke-width="4" stroke-dasharray="10,10"/>
  
  <!-- Bus (Green) Stopped -->
  <rect x="200" y="110" width="120" height="50" rx="5" fill="#388e3c"/>
  <rect x="210" y="115" width="20" height="40" fill="#a5d6a7"/> <!-- Window -->
  
  <!-- Ego Car (Blue) -->
  <rect x="50" y="130" width="70" height="40" rx="5" fill="#1976d2"/>
  <!-- Arrow indicating passing -->
  <path d="M 130 150 Q 170 150 180 190" fill="none" stroke="yellow" stroke-width="4" stroke-dasharray="5,5"/>
  
  <!-- Pedestrian (Orange) popping out -->
  <circle cx="330" cy="115" r="10" fill="#ff9800"/>
  <!-- Danger warning sign ! -->
  <text x="325" y="95" font-family="sans-serif" font-weight="bold" font-size="24" fill="red">!</text>
</svg>
